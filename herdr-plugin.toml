id = "mux"
name = "Mux Pulse"
version = "0.1.22"
description = "Persistent side pane for agent usage, accounts, Git working trees and files"
min_herdr_version = "0.7.0"
platforms = ["macos", "linux"]

[[build]]
command = ["bash", "scripts/download-herdr-binary.sh"]

[[panes]]
id = "quick"
title = "Mux Pulse"
placement = "split"
command = ["./target/release/mux", "quick"]

[[panes]]
id = "editor"
title = "Mux"
placement = "tab"
command = ["./target/release/mux"]

[[actions]]
id = "open"
title = "Toggle Mux Pulse at the right edge"
command = ["./target/release/mux", "quick", "--open"]

[[panes]]
id = "file-editor"
title = "File"
placement = "tab"
command = ["./target/release/mux", "file-edit"]

[[panes]]
id = "session"
title = "AI Session"
placement = "tab"
command = ["./target/release/mux", "session-run"]
