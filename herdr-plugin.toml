id = "mux"
name = "Mux Pulse"
version = "0.1.20"
description = "Persistent side pane for agent usage, accounts and Git working trees"
min_herdr_version = "0.7.0"
platforms = ["macos", "linux"]

[[build]]
command = ["bash", "scripts/download-herdr-binary.sh"]

[[panes]]
id = "quick"
title = "Mux Pulse"
placement = "split"
command = ["./target/release/mux", "quick"]

[[panes]]
id = "editor"
title = "Mux"
placement = "tab"
command = ["./target/release/mux"]

[[actions]]
id = "open"
title = "Toggle Mux Pulse at the right edge"
command = ["./target/release/mux", "quick", "--open"]
