[package]
name = "mux"
version = "0.1.20"
edition = "2024"
rust-version = "1.88"
description = "A terminal configuration manager for coding agents, model providers, accounts, and local proxies"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
notify = "8.2"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
tiktoken-rs = "0.7"
tokio = { version = "1.44", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
rusqlite = { version = "0.38", features = ["bundled"] }
flate2 = "1.0"
tar = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[features]
# Enables only the regression fixture binary, never needed by end users.
test-support = []

[[bin]]
name = "mux"
path = "src/main.rs"

[[bin]]
name = "mux-test-helper"
path = "tests/support/helper.rs"
required-features = ["test-support"]
test = false
